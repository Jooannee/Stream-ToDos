<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embedded Todolist: {{list.name}}</title>
    {% load static %}
    <link rel="stylesheet" href="{%static 'todos/style.css'%}">
</head>
<body>
    <h2>{{list.name}}</h2>
    <ul>
        {% for item in list.items.all %}
            <li>{{item.chat_index}}. {{item.creator_name}} - {{item.title}}</li>
        {% empty %}
            <li>No todos in this list</li>
        {% endfor %}
    </ul> 
</body>
</html>
