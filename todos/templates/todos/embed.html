<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embedded Todolist: {{list.name}}</title>
    {% load static %}
    <link rel="stylesheet" href="{%static 'todos/embed.css' %}">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script src="{%static 'todos/embed.js' %}"></script>
</head>
<body>
    <div class="todo-widget">
        <header class="widget-header">
            <h1 class="widget-title">{{list.name}}</h1>
            <span class="widget-count" id="widget-count">0</span>
        </header>

        <div class="list-view" id="list-view">
            <div class="list-container" id="list-container">
                {% for item in list.active_items %}
                    <div class="todo-item item-{{item.status}}">
                        <div class="todo-index">
                            {{item.chat_index}}
                        </div>
                        <div class="todo-content">
                            <span class="todo-creator">{{item.creator_name}}</span>
                            <span class="todo-title">{{item.title}}</span>
                        </div>
                    </div>
                {% empty %}
                <div class="empty-state" id="empty-state">No tasks! Add one using twitch chat (!todos add).</div>
                {% endfor %}
            </div>
        </div>
    </div>
</body>
</html>
