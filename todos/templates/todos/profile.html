<!DOCTYPE html>
<html lang="en" class="h-full bg-[#1D1122] text-[#E0BBE4]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{streamer.twitch_username}}'s Profile</title>

    {% load static %}
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dreamy: {
                            bg: '#1D1122',
                            deep: '#2D1B33',
                            mid: '#422A4A',
                            light: '#7B5292',
                            lavender: '#E0BBE4',
                            cream: '#FFF7DA',
                            teal: '#083D41',
                        },
                        twitch: {
                            light: '#a855f7',
                            DEFAULT: '#9146FF',
                            dark: '#772CE8',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Fredoka', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="flex flex-col min-h-full font-sans bg-gradient-to-b from-dreamy-bg via-dreamy-deep to-dreamy-bg text-slate-200">
    <nav class="bg-dreamy-deep/90 border-b border-dreamy-lavender/10 sticky top-0 z-40 shadow-lg backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-3">
                    <div class="bg-gradient-to-br from-dreamy-light to-dreamy-lavender p-2 rounded-xl flex items-center justify-center shadow-md shadow-dreamy-deep/50">
                        <i class="fa-solid fa-clipboard-check text-dreamy-bg text-lg"></i>
                    </div>
                    <span class="font-display text-xl font-bold tracking-wide text-dreamy-cream">
                        <a href="{% url 'todos:dashboard' %}">Stream ToDos</a>
                    </span>
                    <span class="bg-dreamy-mid text-dreamy-lavender text-xs px-3 py-1.5 rounded-full font-medium border border-dreamy-lavender/10">Open Beta - Report any Issues please! :3</span>
                </div>

                <div class="flex items-center gap-4">
                    <div class="bg-dreamy-mid text-dreamy-lavender text-xs px-3 py-1.5 rounded-full font-medium border border-dreamy-lavender/10">
                        <i class="fa-brands fa-twitch text-[13px]"></i>
                        <span class="text-xs font-semibold">@{{ user.username }}</span>
                    </div>
                    
                    <div class="h-6 w-[1px] bg-dreamy-lavender/10 hidden sm:block"></div>

                    <div class="flex items-center gap-2">
                        <a href="{% url 'todos:settings' %}" class="text-xs sm:text-sm text-dreamy-lavender/80 hover:text-dreamy-cream px-3 py-2 rounded-md transition-colors hover:bg-dreamy-mid/40" title="Widget Settings">
                            <i class="fa-solid fa-sliders sm:mr-1"></i> <span class="hidden sm:inline">Settings</span>
                        </a>
                        <a href="/accounts/" class="text-xs sm:text-sm text-dreamy-lavender/80 hover:text-dreamy-cream px-3 py-2 rounded-md transition-colors hover:bg-dreamy-mid/40" title="Account Settings">
                            <i class="fa-solid fa-user-cog sm:mr-1"></i> <span class="hidden sm:inline">Account</span>
                        </a>
                        <a href="{% url 'account_logout' %}" class="text-xs sm:text-sm text-red-300 hover:text-red-200 px-3 py-2 rounded-md transition-colors hover:bg-red-950/20">
                            <i class="fa-solid fa-right-from-bracket mr-1"></i> Logout
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 gap-8 grid grid-cols-1 lg:grid-cols-3 items-start">
        <div class="bg-dreamy-deep/80 border border-dreamy-lavender/10 rounded-2xl py-3 px-6 shadow-xl shadow-purple-950/20 backdrop-blur-md flex flex-col hover:border-dreamy-lavender/25 transition-all duration-300 col-span-1 w-full items-center">
            <img src="{{streamer.profile_picture.url}}" alt="{{streamer.twitch_username}}'s Profile Picture" class="aspect-square rounded-full max-w-[200px]">
            <span class="font-display text-xl font-bold text-dreamy-cream tracking-wide">{{streamer.twitch_username}}</span>
            <p class="text-sm text-dreamy-lavender mb-3 leading-5">{{streamer.bio}}</p>
            <a href="https://www.twitch.tv/{{streamer.twitch_username}}" target="_blank" rel="noopener noreferrer" class="hover:text-dreamy-cream transition-colors" title="Twitch">
            <i class="fa-brands fa-twitch"></i>
            </a>
        </div>
        <div class="bg-dreamy-deep/80 border border-dreamy-lavender/10 rounded-2xl py-3 px-6 shadow-xl shadow-purple-950/20 backdrop-blur-md flex flex-col hover:border-dreamy-lavender/25 transition-all duration-300 col-span-1 w-full items-center col-span-1 lg:col-span-2">
            <span class="font-display text-2xl font-bold text-dreamy-cream tracking-wide">Placeholder for fun stats!</span>
        </div>
    </main>

    {% include "todos/footer_partial.html" %}
</body>
</html>
