<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream ToDos Dashboard</title>

    {% load static %}
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script src="{%static 'todos/dash.js'%}"></script>
    <link rel="stylesheet" href="{%static 'todos/dash.css'%}">
</head>
<script type="text/javascript">
    function copyObsLink(todoList) {
        let finalLink = window.location.protocol+"//"+window.location.host+"/embed/"+"{{streamer.obs_token}}"+"/"+todoList;
        navigator.clipboard.writeText(finalLink);
    }
</script>


<body>
    <h1>Stream Todos</h1>
    <h3 style="display: inline;">Welcome {{user.username}}</h3> <a href="/accounts/">Account management</a> <a href="/settings/">User Settings</a> <br>
    {% if error_message %}
        <strong>{{error_message}}</strong> <br>
    {% endif %}
    <button onclick="copyObsLink('chatlist')">Copy Chatlist OBS Source</button>
    <button onclick="copyObsLink('streamerlist')">Copy Streamerlist OBS Source</button>

    <h2>Current Lists - {{ lists|length }}</h2>
    <div id="todolists-container">    
        {% for tlist in lists %}
            <div id="todolist-{{tlist.safe_name}}">
            {% include "todos/dash_list_partial.html" %}
            </div>
        {% endfor %}
    </div>
    <form id="form-newlist">
        {% csrf_token %}
        <input type="text" name="title" id="newlist-title" pattern="[^\/?\\]+">
        <button type="submit">Create new list</button>
    </form>
</body>
</html>
