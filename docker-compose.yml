services:
  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_NAME:-collabtodo}
      POSTGRES_USER: ${DB_USER:-todo_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    expose:
      - "5432"
    restart: always

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    restart: always

  web:
    build: .
    command: >
      sh -c "mkdir -p /app/uploads/profile_picture &&
             cp -n /app/default.jpg /app/uploads/profile_picture/default.jpg &&
             python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             daphne -b 0.0.0.0 -p 8000 streamToDo.asgi:application"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/uploads
    environment:
      - DB_NAME=${DB_NAME:-collabtodo}
      - DB_USER=${DB_USER:-todo_user}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=False
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - CLIENT_ID=${CLIENT_ID}
      - CLIENT_SECRET=${CLIENT_SECRET}
      - BOT_ID=${BOT_ID}
      - OWNER_ID=${OWNER_ID}
    depends_on:
      - db
      - redis
    restart: always
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.cleanup-todos.schedule: "0 0 2 * * *"
      ofelia.job-exec.cleanup-todos.command: "python manage.py cleanup_archived_todos"

  bot:
    build: .
    command: python twitchbot.py
    environment:
      - DB_NAME=${DB_NAME:-collabtodo}
      - DB_USER=${DB_USER:-todo_user}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - CLIENT_ID=${CLIENT_ID}
      - CLIENT_SECRET=${CLIENT_SECRET}
      - BOT_ID=${BOT_ID}
      - OWNER_ID=${OWNER_ID}
    depends_on:
      - db
      - redis
    restart: always

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles
      - media_volume:/app/uploads
    depends_on:
      - web

  scheduler:
    image: mcuadros/ofelia:latest
    depends_on:
      - web
    restart: always
    environment:
      - TZ=Europe/Berlin
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: daemon --docker

volumes:
  postgres_data:
  static_volume:
  media_volume: